<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ece9d8;
            margin: 15px;
        }
        .student-info {
            background: #fff;
            padding: 12px 20px;
            border: 1px solid #7f9db9;
            border-radius: 4px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .paint-container {
            display: inline-flex;
            flex-direction: column;
            border: 2px solid #000;
            background-color: #c0c0c0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        .title-bar {
            background: linear-gradient(90deg, #0058e6, #3a93ff);
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .menu-bar {
            background-color: #c0c0c0;
            padding: 2px 8px;
            font-size: 12px;
            border-bottom: 1px solid #808080;
        }
        .menu-bar span {
            margin-right: 12px;
            cursor: pointer;
        }
        .workspace {
            display: flex;
            background-color: #808080;
            padding: 3px;
        }
        /* Toolbar ด้านซ้าย */
        .toolbar {
            width: 56px;
            background-color: #c0c0c0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            padding: 2px;
            margin-right: 3px;
            align-content: start;
        }
        .tool-btn {
            width: 25px;
            height: 25px;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .tool-btn:active, .tool-btn.active {
            border-style: inset;
            background: #e0e0e0;
        }
        /* Canvas */
        .canvas-area {
            background-color: #ffffff;
            border: 2px inset #ffffff;
            cursor: crosshair;
        }
        canvas {
            display: block;
            background-color: #ffffff;
        }
        /* Controls & Color Palette ด้านล่าง */
        .bottom-bar {
            background-color: #c0c0c0;
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #808080;
        }
        .color-palette {
            display: grid;
            grid-template-rows: 1fr 1fr;
            grid-auto-flow: column;
            gap: 2px;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border: 1px solid #000;
            cursor: pointer;
        }
        .current-color-preview {
            width: 28px;
            height: 28px;
            border: 2px inset #fff;
            background-color: #000000;
        }
        .options-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- ข้อมูลนิสิต -->
    <div class="student-info">
        <strong></strong><br>
        <strong>ชื่อ - นามสกุล:</strong> ศุภวิชญ์ พุ่มพฤกษ์ | <strong>รหัสนิสิต:</strong> 6721601508<br>
        <strong>สาขา:</strong> วิทยาการคอมพิวเตอร์ | <strong>สถานศึกษา:</strong> มหาวิทยาลัยเกษตรศาสตร์ วิทยาเขตกำแพงแสน
    </div>

    <!-- ตัวโปรแกรม Paint -->
    <div class="paint-container">
        <div class="title-bar">Paint - [Untitled]</div>
        <div class="menu-bar">
            <span>File</span><span>Edit</span><span>View</span><span>Image</span><span>Options</span><span>Help</span>
        </div>
        
        <div class="workspace">
            <!-- กล่องเครื่องมือด้านซ้าย -->
            <div class="toolbar">
                <button class="tool-btn active" id="btn-pencil" title="ดินสอ (Pencil)">✏️</button>
                <button class="tool-btn" id="btn-bucket" title="ถังสี (Fill Bucket)">🪣</button>
                <button class="tool-btn" id="btn-spray" title="กระจาย (Spray)">🌧️</button>
                <button class="tool-btn" id="btn-line" title="เส้นตรง (Line)">╱</button>
                <button class="tool-btn" id="btn-rect" title="สี่เหลี่ยม (Rectangle)">⬜</button>
                <button class="tool-btn" id="btn-ellipse" title="วงรี/วงกลม (Ellipse)">⭕</button>
                <button class="tool-btn" id="btn-eraser" title="ยางลบ (Eraser)">🧹</button>
                <button class="tool-btn" id="btn-clear" title="ล้างหน้าจอ">🗑️</button>
            </div>

            <!-- Canvas พื้นที่วาด -->
            <div class="canvas-area">
                <canvas id="paintCanvas" width="600" height="350"></canvas>
            </div>
        </div>

        <!-- แถบเลือกสีและขนาดเส้นด้านล่าง -->
        <div class="bottom-bar">
            <!-- แสดงสีปัจจุบัน -->
            <div class="current-color-preview" id="colorPreview"></div>

            <!-- กล่องสี Palette -->
            <div class="color-palette" id="palette"></div>

            <!-- ตัวเลือกสี Custom -->
            <input type="color" id="customColor" value="#000000" title="เลือกสีเพิ่มเติม">

            <!-- ปรับขนาดความหนาเส้น -->
            <div class="options-group">
                <label for="lineWidth">ขนาดเส้น / สเปรย์ / ยางลบ:</label>
                <input type="range" id="lineWidth" min="1" max="30" value="4">
                <span id="lineWidthVal">4px</span>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');

// Element Controls
const colorPreview = document.getElementById('colorPreview');
const customColor = document.getElementById('customColor');
const lineWidthInput = document.getElementById('lineWidth');
const lineWidthVal = document.getElementById('lineWidthVal');

// State Variables
let currentTool = 'pencil';
let currentColor = '#000000';
let currentLineWidth = 4;
let isDrawing = false;
let startX = 0;
let startY = 0;
let snapshot = null;
let sprayInterval = null;

// รายการสีมาตรฐานสำหรับ Palette
const colors = [
    '#000000', '#808080', '#800000', '#808000', '#008000', '#008080', '#000080', '#800080',
    '#ffffff', '#c0c0c0', '#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'
];

// 1. สร้าง Palette สี
const palette = document.getElementById('palette');
colors.forEach(color => {
    const box = document.createElement('div');
    box.className = 'color-box';
    box.style.backgroundColor = color;
    box.addEventListener('click', () => setColor(color));
    palette.appendChild(box);
});

function setColor(color) {
    currentColor = color;
    colorPreview.style.backgroundColor = color;
    customColor.value = color;
}

customColor.addEventListener('input', (e) => setColor(e.target.value));

// 2. การจัดการขนาดเส้น
lineWidthInput.addEventListener('input', (e) => {
    currentLineWidth = parseInt(e.target.value);
    lineWidthVal.textContent = `${currentLineWidth}px`;
});

// 3. การสลับเครื่องมือ
const tools = {
    'pencil': document.getElementById('btn-pencil'),
    'bucket': document.getElementById('btn-bucket'),
    'spray': document.getElementById('btn-spray'),
    'line': document.getElementById('btn-line'),
    'rect': document.getElementById('btn-rect'),
    'ellipse': document.getElementById('btn-ellipse'),
    'eraser': document.getElementById('btn-eraser')
};

Object.keys(tools).forEach(toolKey => {
    tools[toolKey].addEventListener('click', () => {
        Object.values(tools).forEach(btn => btn.classList.remove('active'));
        tools[toolKey].classList.add('active');
        currentTool = toolKey;
    });
});

document.getElementById('btn-clear').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
});

// 4. คำนวณพิกัดเมาส์
function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: Math.floor(e.clientX - rect.left),
        y: Math.floor(e.clientY - rect.top)
    };
}

// 5. ฟังก์ชันกระจาย (Spray Can)
function drawSpray(x, y) {
    const density = Math.max(10, currentLineWidth * 3);
    const radius = currentLineWidth * 2;
    ctx.fillStyle = currentColor;

    for (let i = 0; i < density; i++) {
        const offsetAngle = Math.random() * 2 * Math.PI;
        const offsetRadius = Math.random() * radius;
        const sprayX = x + offsetRadius * Math.cos(offsetAngle);
        const sprayY = y + offsetRadius * Math.sin(offsetAngle);
        ctx.fillRect(sprayX, sprayY, 1, 1);
    }
}

// 6. ฟังก์ชันถังสี (Flood Fill)
function hexToRgba(hex) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return [ (num >> 16) & 255, (num >> 8) & 255, num & 255, 255 ];
}

function floodFill(startX, startY, fillColorHex) {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    const targetColor = getPixelColor(imgData, startX, startY);
    const fillColor = hexToRgba(fillColorHex);

    if (colorsMatch(targetColor, fillColor)) return;

    const queue = [[startX, startY]];
    const width = canvas.width;
    const height = canvas.height;

    while (queue.length > 0) {
        const [x, y] = queue.pop();
        const currentPos = (y * width + x) * 4;

        if (x < 0 || x >= width || y < 0 || y >= height) continue;

        if (colorsMatch([data[currentPos], data[currentPos+1], data[currentPos+2], data[currentPos+3]], targetColor)) {
            data[currentPos]     = fillColor[0];
            data[currentPos + 1] = fillColor[1];
            data[currentPos + 2] = fillColor[2];
            data[currentPos + 3] = fillColor[3];

            queue.push([x + 1, y]);
            queue.push([x - 1, y]);
            queue.push([x, y + 1]);
            queue.push([x, y - 1]);
        }
    }
    ctx.putImageData(imgData, 0, 0);
}

function getPixelColor(imgData, x, y) {
    const index = (y * imgData.width + x) * 4;
    return [
        imgData.data[index],
        imgData.data[index + 1],
        imgData.data[index + 2],
        imgData.data[index + 3]
    ];
}

function colorsMatch(a, b) {
    return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
}

// 7. Event Listeners สำหรับการวาด
canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    const pos = getMousePos(e);
    startX = pos.x;
    startY = pos.y;

    if (currentTool === 'bucket') {
        floodFill(startX, startY, currentColor);
        isDrawing = false;
        return;
    }

    if (currentTool === 'spray') {
        drawSpray(startX, startY);
        sprayInterval = setInterval(() => drawSpray(pos.x, pos.y), 25);
        return;
    }

    ctx.strokeStyle = (currentTool === 'eraser') ? '#ffffff' : currentColor;
    ctx.fillStyle = currentColor;
    ctx.lineWidth = currentLineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (currentTool === 'pencil' || currentTool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
    } else {
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    const pos = getMousePos(e);

    if (currentTool === 'spray') {
        startX = pos.x;
        startY = pos.y;
        return;
    }

    if (currentTool === 'pencil' || currentTool === 'eraser') {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    } else if (currentTool !== 'bucket') {
        ctx.putImageData(snapshot, 0, 0);
        ctx.beginPath();

        if (currentTool === 'line') {
            ctx.moveTo(startX, startY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        } else if (currentTool === 'rect') {
            const width = pos.x - startX;
            const height = pos.y - startY;
            ctx.strokeRect(startX, startY, width, height);
        } else if (currentTool === 'ellipse') {
            const radiusX = Math.abs(pos.x - startX) / 2;
            const radiusY = Math.abs(pos.y - startY) / 2;
            const centerX = Math.min(startX, pos.x) + radiusX;
            const centerY = Math.min(startY, pos.y) + radiusY;

            ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);
            ctx.stroke();
        }
    }
});

function stopDrawing() {
    isDrawing = false;
    if (sprayInterval) {
        clearInterval(sprayInterval);
        sprayInterval = null;
    }
}

canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseleave', stopDrawing);
</script>

</body>
</html>
